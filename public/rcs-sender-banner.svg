<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="448" viewBox="0 0 1440 448" role="img" aria-label="Twilio Bank sender banner">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="0.45">
      <stop offset="0" stop-color="#08192F"/>
      <stop offset="0.48" stop-color="#182A43"/>
      <stop offset="1" stop-color="#8B1F3A"/>
    </linearGradient>
    <linearGradient id="red-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF223A" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#EF223A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="88" y="34" width="1264" height="380" rx="32"/>
    </clipPath>
  </defs>

  <rect width="1440" height="448" fill="#EDF2F7"/>
  <rect x="88" y="34" width="1264" height="380" rx="32" fill="url(#card)"/>

  <g clip-path="url(#card-clip)">
    <circle cx="1205" cy="213" r="360" fill="url(#red-glow)"/>
    <circle cx="1260" cy="24" r="306" fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="2"/>
    <circle cx="1260" cy="24" r="365" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="1260" cy="24" r="426" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>

    <g opacity="0.85" transform="translate(206 176)">
      <rect width="74" height="54" rx="10" fill="#E4BAC0"/>
      <path d="M24 0v54M49 0v54M0 27h74" fill="none" stroke="#6C3A47" stroke-opacity="0.38" stroke-width="1.5"/>
    </g>
  </g>

  <text x="720" y="265" text-anchor="middle" fill="#FFFFFF" font-family="Avenir Next, Arial, sans-serif" font-size="106" letter-spacing="-5"><tspan font-weight="800">twilio</tspan><tspan dx="15" font-weight="400">bank</tspan></text>
</svg>
