name: CI

on:
  pull_request:
  workflow_call:

jobs:
  checks:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  validate:
    name: Validate
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [ "$CHECKS_RESULT" != success ]; then
            echo "::error::Node checks ended with $CHECKS_RESULT"
            exit 1
          fi
